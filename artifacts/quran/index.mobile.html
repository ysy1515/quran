<!DOCTYPE html>
<html lang="ar" dir="rtl" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1a4731" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>القرآن الكريم</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Critical: set background immediately so iOS WKWebView
      never shows a black screen before React mounts.
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0f2a1a;
        color: #e8f5e9;
        min-height: 100%;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        direction: rtl;
      }
      #root { min-height: 100vh; }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #0d2818 0%, #1a4a2e 40%, #0f3320 70%, #071a0f 100%);
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #app-loading.hidden { opacity: 0; pointer-events: none; }
      #app-loading-text {
        color: #86efac;
        font-size: 1.2rem;
        margin-top: 1rem;
        font-family: 'Scheherazade New', 'Amiri', serif;
      }
      #app-loading-dot {
        width: 48px; height: 48px;
        border: 2px solid rgba(134,239,172,0.3);
        border-top-color: #86efac;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Fonts (Cairo, Amiri Quran) are bundled with the app, so they work offline. -->
  </head>
  <body>
    <!--
      Native loading overlay visible immediately before React mounts.
      React will hide this via ErrorBoundary / App mount.
    -->
    <div id="app-loading" aria-hidden="true">
      <div id="app-loading-dot"></div>
      <div id="app-loading-text">القُرآنُ الكَريمُ</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.mobile.tsx"></script>
  </body>
</html>
