kind = "web"
previewPath = "/"
title = "القرآن الكريم"
version = "1.0.0"
id = "artifacts/quran"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24332

[services.development]
run = "pnpm --filter @workspace/quran run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quran", "run", "build" ]
publicDir = "artifacts/quran/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24332"
BASE_PATH = "/"
