          echo "Latest TestFlight build number: ${LATEST_BUILD_NUMBER:-none}"

          case "$LATEST_BUILD_NUMBER" in
            "") BUILD_NUMBER="12" ;;
            *[!0-9]*) echo "Unexpected latest build number: $LATEST_BUILD_NUMBER" >&2; exit 1 ;;
