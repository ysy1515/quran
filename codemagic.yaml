workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Quran

    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yahya.quran

    scripts:
      - name: Check repository structure
        script: |
          echo "Current directory:"
          pwd

          echo "CM_BUILD_DIR:"
          echo "$CM_BUILD_DIR"

          echo "Repository files:"
          ls -la "$CM_BUILD_DIR"

          echo "Quran app files:"
          ls -la "$CM_BUILD_DIR/artifacts/quran"

      - name: Install pnpm without Corepack
        script: |
          cd "$CM_BUILD_DIR"

          echo "Disable Corepack to avoid yarn packageManager conflict"
          corepack disable || true

          echo "Install pnpm globally using npm"
          npm install -g pnpm@10.26.1

          echo "pnpm version:"
          pnpm --version

      - name: Install dependencies from repository root
        script: |
          cd "$CM_BUILD_DIR"

          echo "Installing workspace dependencies using pnpm"
          pnpm install --frozen-lockfile

      - name: Build mobile web app
        script: |
          cd "$CM_BUILD_DIR/artifacts/quran"

          echo "Building mobile web app"
          pnpm build:mobile

          echo "Check mobile build output"
          ls -la dist
          ls -la dist/mobile

      - name: Sync Capacitor iOS
        script: |
          cd "$CM_BUILD_DIR/artifacts/quran"

          echo "Sync Capacitor iOS"
          npx cap sync ios

      - name: Apply iOS provisioning profiles
        script: |
          cd "$CM_BUILD_DIR/artifacts/quran/ios/App"

          echo "Apply provisioning profiles"
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd "$CM_BUILD_DIR/artifacts/quran/ios/App"

          echo "Available iOS files:"
          ls -la

          if [ -d "App.xcworkspace" ]; then
            echo "Building using App.xcworkspace"
            xcode-project build-ipa \
              --workspace App.xcworkspace \
              --scheme App
          else
            echo "App.xcworkspace not found, building using App.xcodeproj"
            xcode-project build-ipa \
              --project App.xcodeproj \
              --scheme App
          fi

    artifacts:
      - artifacts/quran/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - artifacts/quran/ios/App/DerivedData/**/Build/**/*.app
      - artifacts/quran/ios/App/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
