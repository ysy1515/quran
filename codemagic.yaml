              --scheme App
          fi

      - name: Validate IPA with App Store Connect (no upload)
        script: |
          set -euo pipefail

          # Runs `xcrun altool --validate-app` with the same additional arguments the
          # TestFlight publisher uses, which exercises the Apple ID lookup that failed.
          # --skip-package-upload means nothing is uploaded or submitted.
          app-store-connect publish \
            --path "$CM_BUILD_DIR/artifacts/quran/ios/App/build/ios/ipa/*.ipa" \
            --enable-package-validation \
            --skip-package-upload

