workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Quran

    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yahya.quran

    scripts:
      - name: Go to repository root
        script: |
          cd "$CM_BUILD_DIR"
          pwd
          ls -la

      - name: Install pnpm
        script: |
          cd "$CM_BUILD_DIR"
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm --version

      - name: Install dependencies from repository root
        script: |
          cd "$CM_BUILD_DIR"
          pnpm install

      - name: Build mobile web app
        script: |
          cd "$CM_BUILD_DIR/artifacts/quran"
          pnpm build:mobile

      - name: Sync Capacitor iOS
        script: |
          cd "$CM_BUILD_DIR/artifacts/quran"
          npx cap sync ios

      - name: Apply iOS provisioning profiles
        script: |
          cd "$CM_BUILD_DIR/artifacts/quran/ios/App"
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd "$CM_BUILD_DIR/artifacts/quran/ios/App"
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App

    artifacts:
      - artifacts/quran/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - artifacts/quran/ios/App/DerivedData/**/Build/**/*.app
      - artifacts/quran/ios/App/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
