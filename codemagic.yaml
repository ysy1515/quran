          echo "Verify Rollup native package"
          node -e "require('@rollup/rollup-darwin-arm64'); console.log('Rollup native OK')"

          echo "Verify LightningCSS native binary exists"
          find "$CM_BUILD_DIR/node_modules/.pnpm" -name "lightningcss.darwin-arm64.node" -print -quit

