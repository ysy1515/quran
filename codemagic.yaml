workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Quran

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yahya.quran

    scripts:
      - name: Check repository structure
        script: |
          set -euo pipefail

          echo "Current directory:"
          pwd

          echo "CM_BUILD_DIR:"
          echo "$CM_BUILD_DIR"

          echo "Repository files:"
          ls -la "$CM_BUILD_DIR"

          echo "Quran app files:"
          ls -la "$CM_BUILD_DIR/artifacts/quran"

          echo "Node version:"
          node --version

      - name: Install pnpm without Corepack
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR"

          echo "Disable Corepack to avoid yarn packageManager conflict"
          corepack disable || true

          echo "Install pnpm globally using npm"
          npm install -g pnpm@10.26.1

          echo "pnpm version:"
          pnpm --version

      - name: Clean install workspace dependencies
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR"

          echo "Clean all node_modules"
          rm -rf node_modules
          find . -name "node_modules" -type d -prune -exec rm -rf '{}' +

          echo "Prune pnpm store"
          pnpm store prune || true

          echo "Install workspace dependencies with optional native packages"
          pnpm install --force --no-frozen-lockfile --config.optional=true

      - name: Install missing macOS ARM64 native dependencies
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR"

          echo "Install Rollup and LightningCSS native packages for macOS ARM64"
          pnpm add -Dw @rollup/rollup-darwin-arm64@4.59.0 lightningcss-darwin-arm64@1.31.1 --config.optional=true

          echo "Verify Rollup native package"
          node -e "require('@rollup/rollup-darwin-arm64'); console.log('Rollup native OK')"

          echo "Verify LightningCSS native package"
          node -e "require('lightningcss'); console.log('LightningCSS native OK')"

      - name: Build mobile web app
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR/artifacts/quran"

          echo "Building mobile web app"
          pnpm build:mobile

          echo "Check mobile build output"
          ls -la dist
          ls -la dist/mobile

      - name: Sync Capacitor iOS
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR/artifacts/quran"

          echo "Sync Capacitor iOS"
          npx cap sync ios

      - name: Apply iOS provisioning profiles
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR/artifacts/quran/ios/App"

          echo "Apply provisioning profiles"
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR/artifacts/quran/ios/App"

          echo "Available iOS files:"
          ls -la

          if [ -d "App.xcworkspace" ]; then
            echo "Building using App.xcworkspace"
            xcode-project build-ipa \
              --workspace App.xcworkspace \
              --scheme App
          else
            echo "App.xcworkspace not found, building using App.xcodeproj"
            xcode-project build-ipa \
              --project App.xcodeproj \
              --scheme App
          fi

    artifacts:
      - artifacts/quran/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - artifacts/quran/ios/App/DerivedData/**/Build/**/*.app
      - artifacts/quran/ios/App/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
