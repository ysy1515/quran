openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Quran App API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quran
    description: Quran data operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /surahs:
    get:
      operationId: listSurahs
      tags: [quran]
      summary: List all surahs
      responses:
        "200":
          description: List of all 114 surahs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Surah"

  /surahs/{number}/verses:
    get:
      operationId: getSurahVerses
      tags: [quran]
      summary: Get verses for a surah
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Surah verses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersesResponse"

  /verses/{surahNumber}/{verseNumber}/tafsir:
    get:
      operationId: getVerseTafsir
      tags: [quran]
      summary: Get tafsir for a specific verse
      parameters:
        - name: surahNumber
          in: path
          required: true
          schema:
            type: integer
        - name: verseNumber
          in: path
          required: true
          schema:
            type: integer
        - name: tafsirId
          in: query
          schema:
            type: integer
            default: 169
            description: Tafsir ID (169 = Ibn Kathir Arabic)
      responses:
        "200":
          description: Tafsir for the verse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TafsirResponse"
        "404":
          description: Tafsir not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Tafsir service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pages/{pageNumber}:
    get:
      operationId: getPage
      tags: [quran]
      summary: Get verses for a specific Mushaf page
      parameters:
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 604
      responses:
        "200":
          description: Page data with verses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"

  /juz:
    get:
      operationId: listJuz
      tags: [quran]
      summary: List all 30 juz with metadata
      responses:
        "200":
          description: List of juz
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Juz"

  /search:
    get:
      operationId: searchQuran
      tags: [quran]
      summary: Search surahs by name or verse number
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
            default: ar
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Surah:
      type: object
      properties:
        id:
          type: integer
        number:
          type: integer
        name:
          type: string
          description: Arabic name
        nameSimple:
          type: string
          description: English transliteration
        nameTranslation:
          type: string
          description: English translation
        revelationType:
          type: string
          enum: [Meccan, Medinan]
        versesCount:
          type: integer
        pageNumber:
          type: integer
        juzNumber:
          type: integer
      required:
        - id
        - number
        - name
        - nameSimple
        - nameTranslation
        - revelationType
        - versesCount
        - pageNumber
        - juzNumber

    Verse:
      type: object
      properties:
        id:
          type: string
        verseKey:
          type: string
          description: e.g. "1:1"
        verseNumber:
          type: integer
        text:
          type: string
          description: Arabic Quranic text (Uthmani script)
        translationText:
          type: string
          nullable: true
          description: English translation (Sahih International)
        pageNumber:
          type: integer
        juzNumber:
          type: integer
        hizbNumber:
          type: integer
      required:
        - id
        - verseKey
        - verseNumber
        - text
        - pageNumber
        - juzNumber
        - hizbNumber

    VersesResponse:
      type: object
      properties:
        verses:
          type: array
          items:
            $ref: "#/components/schemas/Verse"
        surah:
          $ref: "#/components/schemas/Surah"
        totalCount:
          type: integer
      required:
        - verses
        - surah
        - totalCount

    TafsirResponse:
      type: object
      properties:
        verseKey:
          type: string
        text:
          type: string
          description: Tafsir text
        tafsirName:
          type: string
        surahName:
          type: string
        verseNumber:
          type: integer
        surahNumber:
          type: integer
      required:
        - verseKey
        - text
        - tafsirName
        - surahName
        - verseNumber
        - surahNumber

    PageResponse:
      type: object
      properties:
        pageNumber:
          type: integer
        verses:
          type: array
          items:
            $ref: "#/components/schemas/Verse"
        surahsOnPage:
          type: array
          items:
            type: integer
        imageUrl:
          type: string
          nullable: true
          description: Optional Mushaf page image URL
      required:
        - pageNumber
        - verses
        - surahsOnPage

    Juz:
      type: object
      properties:
        juzNumber:
          type: integer
        verseMapping:
          type: object
          description: Map of surah number to verse range string
        firstVerseId:
          type: integer
        lastVerseId:
          type: integer
        versesCount:
          type: integer
      required:
        - juzNumber
        - verseMapping
        - firstVerseId
        - lastVerseId
        - versesCount

    SearchResponse:
      type: object
      properties:
        surahs:
          type: array
          items:
            $ref: "#/components/schemas/Surah"
        totalCount:
          type: integer
      required:
        - surahs
        - totalCount

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
